# runClient/runServer：从 GTNH Maven 拉取的 GT5 + NEI 等（仅开发环境，不发布）
# 与本地 GT5-Unofficial 仓库 dependencies.gradle 对齐时可改此版本及下方 dependencies.gradle
gtnhRun.gt5Version = 5.09.52.283

# ---------- SDE 工作台 Web（WebStructureRenderer dist-workbench）同步到 src/main/resources/.../web/ ----------
# npm（默认）= prepareWikiWorkbenchGitRepo（git clone/pull）→ npm ci && build:workbench → 拷贝进 resources | release = 下载 Release zip
sde.workbenchSync = npm
# npm：检出根目录（相对本仓库根，默认 dist-workbench，已 .gitignore）；Vite 产物在其子目录 dist-workbench/
sde.workbenchNpmDir = dist-workbench
sde.workbenchGitUrl = https://github.com/Windorain/WebStructureRenderer.git
# 留空 = 使用远端默认分支；若在 V2 等分支开发则填写，例如：sde.workbenchGitBranch = V2
# sde.workbenchGitBranch =
# release：GitHub owner/repo；须已发布 Release 并上传 zip（当前仓库可无 Release，发布后再改 sde.workbenchSync=release）
sde.workbenchReleaseRepo = Windorain/WebStructureRenderer
# release：资产文件名需包含此子串且为 .zip（例如 web-workbench.zip 可填 workbench）
sde.workbenchReleaseAsset = workbench
# release：zip 解压倒非 dist-workbench 根目录时填写相对解压根的路径；留空则优先用 dist-workbench 子目录否则用解压根
